name: Build and release (shared)

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      prerelease:
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    # 与 pubspec.lock 中记录的镜像源保持一致，避免 CI 每次重新解析全部依赖
    env:
      PUB_HOSTED_URL: https://pub.flutter-io.cn
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
      RELEASE_TAG: ${{ inputs.release_tag }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Report release and internal versions
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          PUBSPEC_VERSION="$(sed -n 's/^version: //p' pubspec.yaml | tr -d '\r' | tr -d ' ')"
          echo "Release tag: ${RELEASE_TAG}"
          echo "Internal version (pubspec): ${PUBSPEC_VERSION}"
          echo "::notice::内部版本的 +build 必须单调递增（Android 才能覆盖安装），版本名与 tag 对应。"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Setup signing (real keystore from secrets)
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          PROPS_B64: ${{ secrets.SIGNING_PROPERTIES_B64 }}
          EXPECTED_DIGEST: 60dcf56f4ed8978b2b118bbe691f77daec68a23732264b95d14a3e3b1325f4e1
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$PROPS_B64" ]; then
            echo "::error::Missing SIGNING_KEYSTORE_B64 / SIGNING_PROPERTIES_B64 secrets."
            echo "::error::Add them in Settings > Secrets and variables > Actions. Refusing to sign with a throwaway key."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/aghm-release.keystore
          echo "$PROPS_B64" | base64 -d > android/key.properties
          if [ ! -s android/app/aghm-release.keystore ]; then
            echo "::error::Decoded keystore is empty. Check SIGNING_KEYSTORE_B64 (expected 3656 chars, starts with MIIK)."
            exit 1
          fi
          STORE_PASS=$(sed -n 's/^storePassword=//p' android/key.properties)
          if [ -z "$STORE_PASS" ]; then
            echo "::error::key.properties missing storePassword. Check SIGNING_PROPERTIES_B64 (expected 152 chars, starts with c3Rv)."
            exit 1
          fi
          ACTUAL=$(keytool -list -v -keystore android/app/aghm-release.keystore -alias aghm -storepass "$STORE_PASS" 2>/dev/null | sed -n 's/^\s*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f' | head -1)
          echo "Decoded keystore cert SHA-256: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED_DIGEST" ]; then
            echo "::error::The keystore in SIGNING_KEYSTORE_B64 is not the expected aghm keystore."
            exit 1
          fi
          echo "Keystore OK: matches expected aghm certificate."

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64 \
            --obfuscate --split-debug-info=build/symbols

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          TITLE="AdGuard Home Manager Mod ${RELEASE_TAG}"
          PRE_FLAG=""
          if [ "$PRERELEASE" = "true" ]; then
            PRE_FLAG="--prerelease"
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --notes-file RELEASE_NOTES.md $PRE_FLAG
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --notes-file RELEASE_NOTES.md $PRE_FLAG
          fi

          # 上传资源容易受网络影响，这里做多次重试。
          for attempt in 1 2 3 4 5; do
            if gh release upload "$RELEASE_TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber; then
              echo "Release asset upload succeeded on attempt ${attempt}"
              break
            fi
            echo "::warning::Release asset upload attempt ${attempt} failed, retrying..."
            sleep 15
          done

          # 上传后校验，避免出现"任务成功但没挂上 APK"的情况。
          ASSETS="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "Release assets: ${ASSETS}"
          if ! printf '%s\n' "$ASSETS" | grep -qx 'app-release.apk'; then
            echo "::error::app-release.apk was not attached to ${RELEASE_TAG}."
            exit 1
          fi
