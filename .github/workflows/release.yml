name: Release (official)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Official release tag (e.g. v2.24.0)'
        required: true
        default: 'v2.24.0'
        type: string

permissions:
  contents: write

jobs:
  # 仅处理不带 "-" 的正式 tag（例如 v2.24.0）；
  # 预发布 tag（v2.24.1-pre.1 / -rc.1 / -beta.1）由 prerelease.yml 处理。
  release:
    if: ${{ !contains(inputs.release_tag || github.ref_name, '-') }}
    uses: ./.github/workflows/_build-and-release.yml
    secrets: inherit
    with:
      release_tag: ${{ inputs.release_tag || github.ref_name }}
      prerelease: false
    permissions:
      contents: write
