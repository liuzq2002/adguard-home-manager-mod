name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Setup signing
        shell: bash
        run: |
          if [ -n "${{ secrets.SIGNING_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.SIGNING_KEYSTORE_B64 }}" | base64 -d > android/app/aghm-release.keystore
            echo "${{ secrets.SIGNING_PROPERTIES_B64 }}" | base64 -d > android/key.properties
          else
            keytool -genkeypair -v \
              -keystore android/app/aghm-release.keystore \
              -alias aghm -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass changeit -keypass changeit \
              -dname "CN=CI, OU=CI, O=CI, L=CI, S=CI, C=CN" > /dev/null 2>&1
            printf 'storePassword=changeit\nkeyPassword=changeit\nkeyAlias=aghm\nstoreFile=aghm-release.keystore\n' > android/key.properties
          fi

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64 \
            --obfuscate --split-debug-info=build/symbols

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AdGuard Home Manager Mod ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: build/app/outputs/flutter-apk/app-release.apk
